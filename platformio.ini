; 1.69inch ST7789 240x280 + ESP32-S3
; WiFi web control: Chinese/English text + JPEG image upload
;
; TFT wiring: SCK=12 MOSI=11 CS=10 DC=9 BLK=4
;             RST NOT CONNECTED (vendor demo passes -1)
;
; platform 5.4.0 matches cached framework 3.20005 in D:\.platformio
;   -> set PLATFORMIO_CORE_DIR=D:\.platformio before running pio
;
; Arduino_GFX 1.4.9 is the last release supporting arduino-esp32 core 2.x
; Chinese font is generated into include/cn_font.h by tools/gen_font.py

[env:esp32s3]
platform  = espressif32@5.4.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
upload_port   = COM3
monitor_port  = COM3

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    bodmer/TJpg_Decoder@^1.0.8
